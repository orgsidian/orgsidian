[workspace]
# Cargo.lock is committed (LD-37, binary-application convention).
# - Reproducible builds across CI matrix.
# - Required for cargo-audit / cargo-deny to lock advisory + license verdicts.
# - Auto-bumped via Dependabot / Renovate PRs (Story 1.8+ wiring).
resolver = "2"
members = [
    "crates/orgsidian-parser",
    "crates/orgsidian-index",
    "crates/orgsidian-watcher",
    "crates/orgsidian-vault",
    "crates/orgsidian-plugin-api",
    "crates/orgsidian-report",
    "crates/orgsidian-core",
    "crates/orgsidian-cli",
    "crates/orgsidian-shell-app",
]
exclude = ["tools/corpus-extractor", "tools/issues-sync"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["Tiziano Basile <tiz.basile@gmail.com>", "Orgsidian contributors"]
repository = "https://github.com/orgsidian/orgsidian"
# rust-version intentionally OMITTED in Story 1.2 — `rust-toolchain.toml` pins
# `stable` and Story 1.8 will harden CI; an MSRV declaration is deferred to
# Story 1.10 (CONTRIBUTING.md owns the policy text).

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Story 1.4: typed IPC bridge. specta/tauri-specta are RC-only; pin exactly per
# upstream docs. thiserror floats on 1.x (stable since 2019). See
# [[feedback_version_policy]] Tauri-ecosystem exemption.
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
thiserror = "1"
# Story 1.8 (LD-38): structured-logging facade for the `invoke_plugin_hook!`
# panic-isolation macro. The leaf crate consumes the facade only; the binary
# wires the subscriber later (Story 1.13 / Epic 2.x) per LD-35.
tracing = "0.1"
# Story 1.9: atomic file writes (LD-8) — anchor smoke + future Story 3.1 retry wrapper.
atomic-write-file = "0.3"
# Story 1.11 (LD-41): fault-injection helpers consumed by tests/failure_modes.rs
# via crates/orgsidian-core dev-dependencies. The `failpoints` feature is
# enabled at the consumer-crate level (NOT here) so production builds compile
# `fail` to no-ops by default. Confirmed latest stable 0.5.1 (2026-05).
fail = "0.5"
# Story 1.12 review P7: dev-only tempdir helper used by perf-canary self-tests
# (orgsidian-core) and the watcher's debounce tests (orgsidian-watcher). Hoisted
# here per [[feedback_version_policy]] single-source-of-truth — replaces the
# bare `tempfile = "3"` previously declared at the crate level.
tempfile = "3"
# Explicit `version` paired with `path` keeps `cargo deny check bans` happy
# (otherwise a path-only dep is interpreted as a `*` wildcard for a public
# crate). Version stays in lockstep with workspace.package.version.
orgsidian-core = { path = "crates/orgsidian-core", version = "0.0.0" }
# Story 1.18 (LD-40): first-use cross-crate edge from `orgsidian-core` to the
# vault LEAF. The LEAF graph rule at deny.toml only allows `orgsidian-core` as
# the wrapper, so a workspace entry is required so the dependent crate can use
# `{ workspace = true }`. Same `version + path` pattern as `orgsidian-core`
# above to keep `cargo deny check bans` happy.
orgsidian-vault = { path = "crates/orgsidian-vault", version = "0.0.0" }
# Story 1.18 (LD-40): TOML 1.x for authoritative settings (de)serialization.
# Story 12.3 may swap the writer to `toml_edit` for format-preserving GUI
# round-trip; the reader stays on `toml` core. MIT/Apache-2.0.
toml = "1"
# Story 1.18 (LD-40): OS-conventional config dir resolution. 6.x is the latest
# stable line. MIT/Apache-2.0.
dirs = "6"
# Story 1.18 (LD-40): property-based testing for the schema round-trip
# fixed-point. First proptest use in the workspace. MIT/Apache-2.0.
proptest = "1"
# Story 2.1 (LD-48): tree-sitter Rust host for the nvim-orgmode/tree-sitter-org
# vendored grammar at crates/orgsidian-parser/grammar/. Latest stable 0.26.x at
# impl time. MIT.
tree-sitter = "0.26"
# Story 2.1: C compiler driver for build.rs — compiles vendored parser.c +
# scanner.c through the host's cc/cl/clang. MIT/Apache-2.0. Pre-allowed.
cc = "1"
# Story 2.3 (FR-1 semantic layer): chrono for org timestamp date/time values
# (NaiveDate/NaiveTime) per the architecture date/time convention — only the
# parser/serializer touch the native org `<YYYY-MM-DD Day HH:MM>` form.
# Already in Cargo.lock as a transitive dep (0.4.44), so this adds a dependency
# *edge*, zero new crates. `default-features = false` drops clock/locale/wasm
# baggage; `std` is all NaiveDate/NaiveTime need. MIT/Apache-2.0.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Reserved namespace for future workspace-level cargo-deny metadata (e.g.,
# per-crate license exceptions). Empty as of Story 1.7 — slot exists so a
# future contributor sees the convention.
[workspace.metadata.cargo-deny]

# [profile.release] panic = "unwind" per LD-38 (plugin panic isolation under
# static linking). The Rust default for release profile is `panic = "abort"`
# (smaller binaries, no unwinding tables). LD-38 OVERRIDES this because the
# `invoke_plugin_hook!` macro in `crates/orgsidian-core/src/registry.rs` relies
# on `std::panic::catch_unwind` to keep the host process alive when a (bundled
# v1.0 or WASM v1.5+) plugin panics inside a hook. `catch_unwind` is a no-op
# under `panic = "abort"` — the process dies before the handler runs.
# Trade-off: ~1-3% larger release binary + slightly slower compile + unwinding
# tables in the binary. Accepted per LD-38 (plugin reliability > binary size).
[profile.release]
panic = "unwind"
