[workspace]
# Cargo.lock is committed (LD-37, binary-application convention).
# - Reproducible builds across CI matrix.
# - Required for cargo-audit / cargo-deny to lock advisory + license verdicts.
# - Auto-bumped via Dependabot / Renovate PRs (Story 1.8+ wiring).
resolver = "2"
members = [
    "crates/orgsidian-parser",
    "crates/orgsidian-index",
    "crates/orgsidian-watcher",
    "crates/orgsidian-vault",
    "crates/orgsidian-plugin-api",
    "crates/orgsidian-report",
    "crates/orgsidian-core",
    "crates/orgsidian-cli",
    "crates/orgsidian-shell-app",
]
exclude = ["tools/corpus-extractor", "tools/issues-sync", "scripts/memory-soak"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["Tiziano Basile <tiz.basile@gmail.com>", "Orgsidian contributors"]
repository = "https://github.com/orgsidian/orgsidian"
# rust-version intentionally OMITTED in Story 1.2 — `rust-toolchain.toml` pins
# `stable` and Story 1.8 will harden CI; an MSRV declaration is deferred to
# Story 1.10 (CONTRIBUTING.md owns the policy text).

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Story 1.4: typed IPC bridge. specta/tauri-specta are RC-only; pin exactly per
# upstream docs. thiserror floats on 1.x (stable since 2019). See
# [[feedback_version_policy]] Tauri-ecosystem exemption.
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
thiserror = "1"
# Story 1.8 (LD-38): structured-logging facade for the `invoke_plugin_hook!`
# panic-isolation macro. The leaf crate consumes the facade only; the binary
# wires the subscriber later (Story 1.13 / Epic 2.x) per LD-35.
tracing = "0.1"
# Story 1.9: atomic file writes (LD-8) — anchor smoke + future Story 3.1 retry wrapper.
atomic-write-file = "0.3"
# Story 1.11 (LD-41): fault-injection helpers consumed by tests/failure_modes.rs
# via crates/orgsidian-core dev-dependencies. The `failpoints` feature is
# enabled at the consumer-crate level (NOT here) so production builds compile
# `fail` to no-ops by default. Confirmed latest stable 0.5.1 (2026-05).
fail = "0.5"
# Story 1.12 review P7: dev-only tempdir helper used by perf-canary self-tests
# (orgsidian-core) and the watcher's debounce tests (orgsidian-watcher). Hoisted
# here per [[feedback_version_policy]] single-source-of-truth — replaces the
# bare `tempfile = "3"` previously declared at the crate level.
tempfile = "3"
# Explicit `version` paired with `path` keeps `cargo deny check bans` happy
# (otherwise a path-only dep is interpreted as a `*` wildcard for a public
# crate). Version stays in lockstep with workspace.package.version.
orgsidian-core = { path = "crates/orgsidian-core", version = "0.0.0" }
# Story 1.18 (LD-40): first-use cross-crate edge from `orgsidian-core` to the
# vault LEAF. The LEAF graph rule at deny.toml only allows `orgsidian-core` as
# the wrapper, so a workspace entry is required so the dependent crate can use
# `{ workspace = true }`. Same `version + path` pattern as `orgsidian-core`
# above to keep `cargo deny check bans` happy.
orgsidian-vault = { path = "crates/orgsidian-vault", version = "0.0.0" }
# Story 3.6 (LD-37 / FR-15 / FR-17): THIRD cross-crate LEAF edge — from
# `orgsidian-core` to the index LEAF, following the `orgsidian-vault` and
# `orgsidian-parser` precedents above. The LEAF graph rule at deny.toml:193-194
# lists `orgsidian-core` as the ONLY permitted wrapper of `orgsidian-index`, so
# the workspace entry exists so `orgsidian-core` can consume it via
# `{ workspace = true }`. The edge lands now because 3.6 is the first story that
# turns real `.org` files into index rows (the scan orchestrator wires
# parser → index inside core — Dev Note 1). Same `version + path` pattern to
# keep `cargo deny check bans` happy.
orgsidian-index = { path = "crates/orgsidian-index", version = "0.0.0" }
# Story 5.4 (LD-9 / FR-16): FOURTH cross-crate LEAF edge — from `orgsidian-core`
# to the watcher LEAF. The LEAF graph rule (deny.toml `wrappers = ["orgsidian-core"]`
# on `orgsidian-watcher`) allows ONLY `orgsidian-core` to wrap it, so the
# reconciler that consumes a debounced `FileChanged` and drives the vault reload
# + index re-sync must live in core. Same `version + path` pattern as the
# vault/index/parser entries above to keep `cargo deny check bans` happy.
orgsidian-watcher = { path = "crates/orgsidian-watcher", version = "0.0.0" }
# Story 1.18 (LD-40): TOML 1.x for authoritative settings (de)serialization.
# Story 12.3 may swap the writer to `toml_edit` for format-preserving GUI
# round-trip; the reader stays on `toml` core. MIT/Apache-2.0.
toml = "1"
# Story 1.18 (LD-40): OS-conventional config dir resolution. 6.x is the latest
# stable line. MIT/Apache-2.0.
dirs = "6"
# Story 1.18 (LD-40): property-based testing for the schema round-trip
# fixed-point. First proptest use in the workspace. MIT/Apache-2.0.
proptest = "1"
# Story 2.1 (LD-48): tree-sitter Rust host for the nvim-orgmode/tree-sitter-org
# vendored grammar at crates/orgsidian-parser/grammar/. Latest stable 0.26.x at
# impl time. MIT.
tree-sitter = "0.26"
# Story 2.1: C compiler driver for build.rs — compiles vendored parser.c +
# scanner.c through the host's cc/cl/clang. MIT/Apache-2.0. Pre-allowed.
cc = "1"
# Story 2.3 (FR-1 semantic layer): chrono for org timestamp date/time values
# (NaiveDate/NaiveTime) per the architecture date/time convention — only the
# parser/serializer touch the native org `<YYYY-MM-DD Day HH:MM>` form.
# Already in Cargo.lock as a transitive dep (0.4.44), so this adds a dependency
# *edge*, zero new crates. `default-features = false` drops clock/locale/wasm
# baggage; `std` is all NaiveDate/NaiveTime need. MIT/Apache-2.0.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Story 2.8 (LD-27/LD-37): second cross-crate LEAF edge — `orgsidian-core`
# grows the parser façade so the CLI consumes the parser through core only
# (deny.toml LEAF graph rule). `features = ["serde"]` activates the parser's
# opt-in Serialize derives (camelCase JSON for `orgsidian parse --json`).
# Same `version + path` pattern as `orgsidian-vault` above to keep
# `cargo deny check bans` happy.
orgsidian-parser = { path = "crates/orgsidian-parser", version = "0.0.0", features = ["serde"] }
# Story 2.8 (LD-27): clap derive for the CLI command tree — clap annotations
# are the primary CLI documentation (architecture CLI Documentation Strategy).
# Latest stable 4.6.x at impl time. MIT/Apache-2.0.
clap = { version = "4", features = ["derive"] }
# Story 2.8 (LD-27): build-time man-page generation into the in-tree
# `crates/orgsidian-cli/man/` dir via build.rs. Requires clap ^4 (satisfied).
# Latest stable 0.3.x at impl time. MIT/Apache-2.0.
clap_mangen = "0.3"
# Story 2.8: dev-only CLI integration-test runner (spawns the real
# `orgsidian` binary; architecture assert_cmd convention). Latest stable
# 2.x at impl time. MIT/Apache-2.0.
assert_cmd = "2"
# Story 3.3 (LD-4/LD-11/LD-14, FR-17): SQLite driver for the derived index.
# `bundled` is mandatory, not a convenience — it compiles the SQLite
# amalgamation through `cc` with `-DSQLITE_ENABLE_FTS5`, which LD-4's FTS5
# requirement depends on. A system SQLite is not guaranteed to carry FTS5, is
# absent on the Windows CI cell, and would give the four LD-32 matrix targets
# four different SQLite versions. 0.40.x is the current stable line
# (verified 2026-08-02) per [[feedback_version_policy]] latest-stable.
# LD-37 canonical-version invariant: rusqlite must NEVER be added to
# `[bans].skip`/`skip-tree` (deny.toml:127-131). MIT.
rusqlite = { version = "0.40", features = ["bundled"] }
# Story 3.4 (LD-12/LD-13, FR-17): forward-only migration runner over rusqlite.
# The version is LOCK-STEP with rusqlite, not free: rusqlite_migration re-exports
# rusqlite types in its public API (the up_with_hook hook takes a
# &rusqlite::Transaction), so each release pins a single rusqlite minor —
# 2.6 -> rusqlite ^0.40, 2.5 -> ^0.39, 2.4 -> ^0.38 (crates.io, 2026-08-04).
# Today only 2.6.x resolves — but it is the `rusqlite = "0.40"` pin above that
# excludes 2.7+ (they require rusqlite 0.41+), NOT this string: `"2.6"` is a
# caret req (>=2.6.0, <3.0.0), so it would permit 2.7 exactly as a bare "2"
# would. We write "2.6" to floor the line and document the lock-step, not
# because the string itself locks it — the transitive rusqlite pin does.
# WHEN rusqlite IS NEXT BUMPED (e.g. 0.41), rusqlite_migration MUST bump in the
# same PR (to 2.7+) or the workspace fails to resolve — a coupled pair like the
# Tauri exception in [[feedback_version_policy]]. Default features only: NOT
# `from-directory` (it pulls include_dir for a directory-loading path unused
# here — we load with include_str! + M::up_with_hook). Only mandatory transitive
# dep is `log ^0.4`, already in Cargo.lock. MIT (matches rusqlite).
rusqlite_migration = "2.6"
# Story 3.5 (LD-14/LD-16, FR-17): the GENERIC deadpool pool crate — NOT
# `deadpool-sqlite`. LD-14 names `deadpool-sqlite`, but `deadpool-sqlite 0.13`
# (latest, 2026-02-17) still pins `rusqlite ^0.38` and would pull a SECOND
# rusqlite (0.38) into the graph next to the workspace's `rusqlite 0.40`. That
# trips `cargo deny check bans` (`multiple-versions = "deny"`), and LD-37
# (deny.toml:127-131) FORBIDS ever adding `rusqlite` to `skip`/`skip-tree`. So
# the crate uses generic `deadpool` (no rusqlite edge — deps are
# `deadpool-runtime`, `num_cpus`, `tokio` feature `sync`; verified crates.io
# 2026-08-13) with a ~30-line local `Manager` over our own rusqlite-0.40
# `Connection` — same "deadpool, default size 4" per LD-14's intent, one
# canonical rusqlite. Features: `managed` (the pool) + `rt_tokio_1`
# (`Runtime::Tokio1`); native async-fn-in-traits, so NOT `async-trait`. When
# rusqlite is next bumped, re-check whether `deadpool-sqlite` has caught up and
# the local Manager can be retired (deferred-work coupling). MIT OR Apache-2.0.
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
# Story 3.5 (LD-14/LD-16): async runtime primitives for the connection model —
# `mpsc`/`oneshot` (the writer channel), `spawn_blocking` (every blocking
# rusqlite call runs off the async worker threads, LD-16), and `Runtime::Tokio1`
# for deadpool. LD-37 canonical-version invariant: `tokio` must NEVER be added
# to `[bans].skip`/`skip-tree` (deny.toml:127-131, architecture.md:1168). Pin
# `"1"` so Cargo UNIFIES on the `tokio 1.52.3` already in Cargo.lock (Tauri's) —
# no second tokio major. `default-features = false` here; each consumer opts
# into exactly the features it needs. MIT.
tokio = { version = "1", default-features = false }
# Story 3.6 (FR-15 / LD-42): recursive directory iterator for the vault's
# `.org` discovery walk (`orgsidian-vault/src/path.rs`). `walkdir 2.5.0` is
# ALREADY in `Cargo.lock` transitively, so pinning `"2"` UNIFIES the graph on
# it — no new crate download, no duplicate major (`cargo tree -i walkdir` shows
# a single version after this direct edge is added). Consumed by
# `orgsidian-vault` only (the walk lives there); NOT added to `orgsidian-core`,
# which reaches the walk through the vault. MIT/Unlicense (allowlist-compatible).
walkdir = "2"
# Story 5.3 (FR-16 / Party Mode P0): SHA-256 for the `ConflictState.ancestor_hash`
# rich-conflict field (`orgsidian-vault/src/hash.rs`). `sha2 0.10.9` is ALREADY in
# `Cargo.lock` transitively (Tauri's `tauri-utils`/`tao` pull it), so pinning
# `"0.10"` UNIFIES the graph on it — this adds a dependency EDGE, zero new crates
# and no duplicate major (`digest`/`generic-array`/`cpufeatures`/`cfg-if` are all
# already resolved). `default-features = false` keeps it minimal: the `Digest`
# hashing API is `no_std`-core, and vault needs nothing from the `std` feature.
# Consumed by `orgsidian-vault` only (the LEAF that owns the conflict model). The
# newtype is a general primitive a future index content-hash consumer may reuse.
# RustCrypto: MIT OR Apache-2.0 (allowlist-compatible).
sha2 = { version = "0.10", default-features = false }
# Nightly fix (arch-linux cell): dev-only `geteuid()` probe used by
# `orgsidian-core/tests/scan.rs` to skip the chmod-000 quarantine test under
# root (root bypasses mode bits, so the unreadable-file scenario is not
# exercisable there — LD-41 quarantine path). `libc 0.2.x` is ALREADY in
# `Cargo.lock` transitively, so pinning `"0.2"` UNIFIES the graph on it — no new
# crate, no duplicate major. Consumed only as a `cfg(unix)` dev-dependency of
# `orgsidian-core`. MIT OR Apache-2.0 (allowlist-compatible).
libc = "0.2"

# Reserved namespace for future workspace-level cargo-deny metadata (e.g.,
# per-crate license exceptions). Empty as of Story 1.7 — slot exists so a
# future contributor sees the convention.
[workspace.metadata.cargo-deny]

# [profile.release] panic = "unwind" per LD-38 (plugin panic isolation under
# static linking). The Rust default for release profile is `panic = "abort"`
# (smaller binaries, no unwinding tables). LD-38 OVERRIDES this because the
# `invoke_plugin_hook!` macro in `crates/orgsidian-core/src/registry.rs` relies
# on `std::panic::catch_unwind` to keep the host process alive when a (bundled
# v1.0 or WASM v1.5+) plugin panics inside a hook. `catch_unwind` is a no-op
# under `panic = "abort"` — the process dies before the handler runs.
# Trade-off: ~1-3% larger release binary + slightly slower compile + unwinding
# tables in the binary. Accepted per LD-38 (plugin reliability > binary size).
[profile.release]
panic = "unwind"
