[package]
name = "orgsidian-core"
description = "Core domain orchestrator wiring parser/index/watcher/vault/plugin-api/report (cross-crate composition root)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Story 1.9 (LD-9): opt-in surface for the `test_support` module. Consumer crates
# enable it via `[dev-dependencies] orgsidian-core = { features = ["test-support"] }`
# so `FakeClock` (and Story 1.12's perf helpers) stay out of release builds.
# Story 1.12 (LD-32 / NFR-20): perf baseline JSON I/O is gated under the same
# test-support feature so production builds exclude serde_json from the leaf
# crate's transitive set.
# Story 3.1 (LD-41): activates the vault's atomic-write fail-point so the
# workspace-root failure-mode harness (required-features = ["test-support"])
# can inject disk-full errors via `fail::cfg`.
test-support = ["dep:serde_json", "orgsidian-vault/failpoints"]

[dependencies]
# Cross-crate edges wired incrementally per first-use story (see Dev Notes §1).
# Story 1.4: first real deps — OrgError IPC type derives thiserror::Error +
# serde::Serialize + specta::Type.
thiserror = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
# Story 1.8 (LD-38): structured-logging facade used by the
# `invoke_plugin_hook!` panic-isolation macro in `registry.rs`. Subscriber
# wiring is the binary's job (LD-35); the leaf crate consumes the facade only.
tracing = { workspace = true }
# Story 1.12 (LD-32 / NFR-20): JSON I/O for perf baselines under tests/perf-baselines/.
# `optional = true` + the `dep:serde_json` activator on the `test-support` feature
# (above) keep this OUT of production binary builds. Pin floats on 1.x (workspace dep).
serde_json = { workspace = true, optional = true }
# Story 1.18 (LD-40): TOML settings authoritative store. First cross-crate edge
# to `orgsidian-vault` (LEAF graph rule per deny.toml#L186-188). `toml` + `dirs`
# are the new direct deps; both float on the latest stable major (see workspace).
orgsidian-vault = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
# Story 2.8 (LD-27/LD-37): second cross-crate LEAF edge — re-exported as the
# `parser` façade module so consumers (first: `orgsidian-cli`) reach the
# parser through core only, per the deny.toml LEAF graph rule. The workspace
# entry activates the parser's opt-in `serde` feature.
orgsidian-parser = { workspace = true }
# Story 3.6 (LD-37 / FR-15 / FR-17): THIRD cross-crate LEAF edge — the scan
# orchestrator (`src/index/`) is the only place both `parser` and `index` are
# visible (Dev Note 1): it maps `Document` → the index crate's parser-agnostic
# `FileIndexInput` and submits the writes. `orgsidian-core` is the sole
# permitted wrapper of the `orgsidian-index` LEAF (deny.toml:193-194).
orgsidian-index = { workspace = true }
# Story 3.6 (LD-16): `spawn_blocking` moves each file's read + `parser::analyze`
# (CPU-bound) off the async worker threads; the scan awaits the LD-14 writer's
# `execute` per checkpoint. `rt` carries `spawn_blocking`; the writer/pool
# futures need no extra feature here. Pinned `"1"` unifies on the workspace
# tokio (Tauri's) — no second major.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
# Story 1.11 (LD-41): fault-injection helpers for the workspace-root failure-mode
# harness. `failpoints` feature is non-negotiable — without it `fail::cfg` /
# `fail_point!` compile to no-ops and downstream tests silently bypass.
fail = { workspace = true, features = ["failpoints"] }
# Story 1.12: self-tests for the perf macro use tempdir-scoped baselines so
# parallel test runs do not collide on shared baseline files. Hoisted to the
# workspace per Story 1.12 review P7 / [[feedback_version_policy]].
tempfile = { workspace = true }
# Story 1.18 (LD-40): property-based round-trip test for the settings schema.
proptest = { workspace = true }
# Story 3.6 (AC4): `tests/scan.rs` spawns the LD-14 `IndexWriter` and exercises
# the reader pool, so it needs `#[tokio::test(flavor = "multi_thread")]` (the
# writer/pool overlap genuinely, per Story 3.5's `tests/concurrency.rs`
# precedent) plus the test macros. Additive with the main-dep `rt` feature.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Story 1.11 (LD-41): workspace-root failure-mode harness + coverage gate live
# physically at `tests/` (see test-design.md §5.1 — discoverability of the
# cross-cutting failure-mode catalog at top level). The workspace root Cargo.toml
# is virtual (`[workspace]` only) so `tests/*.rs` is NOT auto-discovered by
# Cargo. `orgsidian-core` is the natural host crate (cross-crate integrator);
# the `[[test]]` declarations below point Cargo at the workspace-root files.
[[test]]
name = "failure_modes"
path = "../../tests/failure_modes.rs"
required-features = ["test-support"]

[[test]]
name = "failure_modes_coverage"
path = "../../tests/failure_modes_coverage.rs"

# Story 1.12 review P2: `tests/perf_canary.rs` references `serde_json` which is
# gated behind the `test-support` feature. Without this `[[test]]` block the
# file is auto-discovered and `cargo test -p orgsidian-core` (no feature flag)
# fails to compile with E0433 — the workspace-wide `cargo test --workspace`
# only happens to work because `orgsidian-watcher` activates `test-support` via
# its dev-dep. Declare the binding explicitly + require `test-support`.
[[test]]
name = "perf_canary"
path = "tests/perf_canary.rs"
required-features = ["test-support"]

# Story 1.18 (LD-40): workspace-root drift guard for the boundary doc, mirroring
# the failure_modes pattern above. Lives at workspace `tests/` because the
# boundary doc is a cross-cutting architecture artifact.
[[test]]
name = "settings_boundary_doc"
path = "../../tests/settings_boundary_doc.rs"

# Story 1.18 (LD-40): traceability grep-smoke. Scans `src/settings/` for the
# `LD-40 + FR-23` annotation per Story 1.17's grep-smoke convention.
[[test]]
name = "settings_trace"
path = "../../tests/settings.rs"
