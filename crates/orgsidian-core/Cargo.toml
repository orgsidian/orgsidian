[package]
name = "orgsidian-core"
description = "Core domain orchestrator wiring parser/index/watcher/vault/plugin-api/report (cross-crate composition root)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Story 1.9 (LD-9): opt-in surface for the `test_support` module. Consumer crates
# enable it via `[dev-dependencies] orgsidian-core = { features = ["test-support"] }`
# so `FakeClock` (and Story 1.12's perf helpers) stay out of release builds.
test-support = []

[dependencies]
# Cross-crate edges wired incrementally per first-use story (see Dev Notes §1).
# Story 1.4: first real deps — OrgError IPC type derives thiserror::Error +
# serde::Serialize + specta::Type.
thiserror = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
# Story 1.8 (LD-38): structured-logging facade used by the
# `invoke_plugin_hook!` panic-isolation macro in `registry.rs`. Subscriber
# wiring is the binary's job (LD-35); the leaf crate consumes the facade only.
tracing = { workspace = true }
