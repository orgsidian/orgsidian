[package]
name = "orgsidian-watcher"
description = "Filesystem watcher (notify-rs) + debounce + external-edits reconciliation (FR-16, NFR-16)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
notify = "8.2.0"
# Story 1.9: thiserror for `DetectError`. notify-rs lands in Story 5.1.
thiserror = { workspace = true }

[dev-dependencies]
# Story 1.9: pull `Clock` trait + `FakeClock` from core's gated test_support
# surface. Story 1.12 review P7 hoisted `tempfile` to the workspace deps
# (single-source-of-truth per [[feedback_version_policy]]).
orgsidian-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
# Story 5.2: parse the golden-trace fixtures (tests/golden_traces/*.json) in the
# `tests/debounce.rs` replay harness. Test-only — the production watcher stays
# serde-free. Workspace-pinned (already in the lockfile).
serde = { workspace = true }
serde_json = { workspace = true }
