[package]
name = "orgsidian-index"
description = "SQLite index + query API + FTS5 search (FR-12, FR-17)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Story 3.3 (LD-4): SQLite driver. `bundled` carries the amalgamation with
# FTS5 enabled — see the workspace entry for the full rationale.
rusqlite = { workspace = true }
# Story 3.3 (AC5): IndexError derives per the VaultError/SettingsError precedent.
thiserror = { workspace = true }

[dev-dependencies]
# Story 3.3 (AC6): temp-file DB fixtures. The PRAGMA assertions need a real
# on-disk database (`:memory:` cannot enter WAL), so every test gets its own
# TempDir. Dev-only, per-crate — mirrors orgsidian-vault/Cargo.toml.
tempfile = { workspace = true }
