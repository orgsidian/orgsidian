[package]
name = "orgsidian-shell-app"
description = "Tauri 2.x shell application for orgsidian"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orgsidian_shell_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
orgsidian-core = { workspace = true }
# Story 4.1: async file I/O for `open_file` so the read never blocks the Tokio
# executor Tauri runs commands on (`fs` feature only — the runtime itself is
# Tauri's).
tokio = { workspace = true, features = ["fs"] }
# Story 1.18 (LD-40): structured logging for the bootstrap smoke that proves the
# settings store wire is live. Facade only; subscriber wiring stays as Tauri
# plugin-log's job (LD-35).
tracing = { workspace = true }
tauri-specta = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
# Story 4.1: `open_file` unit tests write a temp file with invalid UTF-8 bytes
# to prove the non-UTF-8 → `OrgError::Io` matrix row; tempfile handles cleanup.
tempfile = { workspace = true }
