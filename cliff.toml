# cliff.toml — Story 1.15 (LD-54 CC → CHANGELOG mapping).
#
# This file encodes the Conventional-Commits → Keep-a-Changelog v1.1.0 mapping
# documented in CONTRIBUTING.md §2.4 and architecture.md LD-54. It is invoked by
# `cargo release`'s `pre-release-hook` (see release.toml) at every tag and is
# smoke-tested by `scripts/smoke-git-cliff.sh` against a 5-commit fixture
# (.github/workflows/release-smoke.yml runs the smoke on every PR + post-merge
# main). The smoke is the contract: 9 hard-coded assertions cover the LD-54
# mapping table verbatim, including the empty-headings invariant for
# maintainer-fill sections (`### Deprecated`, `### Security`).
#
# LD-54 mapping (binding for `[git.commit_parsers]` below):
#   feat            → Added
#   fix             → Fixed
#   perf            → Changed
#   refactor!       → Changed   (non-breaking `refactor` is skipped)
#   revert          → Changed
#   feat! / fix!    → Changed (+ template prefix `⚠ BREAKING:`)
#   BREAKING CHANGE → Changed (+ template prefix `⚠ BREAKING:`)
#   docs/style/test/build/ci/chore (non-breaking) → excluded (skip = true)
#   Deprecated / Security → manual entries; template emits empty headings.
#
# Conventions:
# - NO `[changelog.footer]` content per [[feedback_no_co_author_credit]]
#   (no "Generated by git-cliff" line).
# - NO `[remote.github]` / network calls (hermetic config; PR-link decoration
#   is a deferred follow-up, not in Story 1.15 scope).
# - Commit-id permalinks are hardcoded against `orgsidian/orgsidian`
#   (the repository is public; no remote-API auto-discovery needed).
# - The template body uses a literal-emit pattern: six `### <Heading>` lines
#   are rendered unconditionally so the maintainer always has a slot to write
#   into for the manual `### Deprecated` / `### Security` entries (AC6).

[changelog]
# Header is prepended only when generating from scratch (without --prepend).
# `cargo release` always uses `--prepend`, which strips this header on output;
# kept here so a developer running `git-cliff --output CHANGELOG.md` from a
# clean slate gets a drop-in-compatible file matching the existing
# CHANGELOG.md L1-L11 prose.
header = """
# Changelog

All notable changes to the Orgsidian desktop app are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and the project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)
from v0.1 Alpha onwards (per architecture LD-1 / LD-33).

CHANGELOG entries below the Unreleased heading are generated by
[`git-cliff`](https://git-cliff.org/) from Conventional Commits (see
[`CONTRIBUTING.md`](./CONTRIBUTING.md) + architecture LD-54). Manual entries
under `Deprecated` and `Security` are inserted before each `cargo release` tag.

"""

# Body template (Tera). Six KAC headings emitted unconditionally — empty
# buckets are intentional maintainer-fill slots (AC6). Breaking commits get
# a `⚠ BREAKING:` prefix in the `Changed` bucket entries (the parsers below
# route them to `Changed`; the template branches on `commit.breaking` for
# the prefix, regardless of which parser caught them).
body = """
{% if commits | length > 0 -%}
## [{% if version %}{{ version | trim_start_matches(pat="v") }}{% else %}Unreleased{% endif %}]{% if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}

### Added
{% for commit in commits | filter(attribute="group", value="Added") -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/orgsidian/orgsidian/commit/{{ commit.id }})){% endif %}
{% endfor %}
### Changed
{% for commit in commits | filter(attribute="group", value="Changed") -%}
- {% if commit.breaking %}⚠ BREAKING: {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/orgsidian/orgsidian/commit/{{ commit.id }})){% endif %}
{% endfor %}
### Deprecated

### Removed
{% for commit in commits | filter(attribute="group", value="Removed") -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/orgsidian/orgsidian/commit/{{ commit.id }})){% endif %}
{% endfor %}
### Fixed
{% for commit in commits | filter(attribute="group", value="Fixed") -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/orgsidian/orgsidian/commit/{{ commit.id }})){% endif %}
{% endfor %}
### Security

{% endif -%}
"""

trim = true

[git]
# CC parsing on; unconventional commits are not pre-filtered at git-cliff
# stage (they remain in the corpus but only render if a parser routes them
# to a group the template iterates — see commit_parsers below for the LD-54
# routing). LD-54's commitlint chain is the upstream enforcement.
conventional_commits = true
filter_unconventional = false
# LD-33 tag scheme: `v*` with optional pre-release suffix
# (e.g. `v0.1.0-alpha.1`).
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+(-.*)?"

# Parser ORDER matters — first match wins. Breaking-marker parsers (`!` or
# BREAKING CHANGE footer) must come BEFORE the non-breaking equivalents so
# that `feat!:` is routed to `Changed`, not `Added`. The scope-capturing
# group `(\(.+\))?` is required to match CC v1.0.0 scoped breaking forms
# (`feat(parser)!:`, `fix(vault)!:`, `refactor(api)!:`).
commit_parsers = [
  # Breaking commits → Changed (template adds `⚠ BREAKING:` prefix).
  { message = "^feat(\\(.+\\))?!", group = "Changed" },
  { message = "^fix(\\(.+\\))?!", group = "Changed" },
  { message = "^refactor(\\(.+\\))?!", group = "Changed" },
  { footer = "^BREAKING CHANGE", group = "Changed" },
  # User-visible refactors are signalled via `refactor!`; non-breaking
  # `refactor` is excluded per LD-54.
  { message = "^refactor", skip = true },
  # Non-breaking, user-visible types.
  { message = "^revert", group = "Changed" },
  { message = "^perf", group = "Changed" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  # Internal types — excluded from CHANGELOG.
  { message = "^(docs|style|test|build|ci|chore)", skip = true },
]
