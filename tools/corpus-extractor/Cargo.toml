# Story 2.5 — corpus extractor (LD-44, OD-1). Standalone crate: OUTSIDE
# `[workspace.members]` (root Cargo.toml `exclude` list, LD-5 leaf-isolation,
# mirroring tools/issues-sync/). Build/test via:
#   cargo build --manifest-path tools/corpus-extractor/Cargo.toml --locked
#   cargo test  --manifest-path tools/corpus-extractor/Cargo.toml --locked
[package]
name = "orgsidian-corpus-extractor"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Extracts test corpus from org-element.el assertions (Story 2.5)"

[[bin]]
name = "orgsidian-corpus-extractor"
path = "src/main.rs"

[lib]
name = "orgsidian_corpus_extractor"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Small blocking HTTP client for the `fetch` subcommand only (one GET at
# extraction time, maintainer operation — no network in any test).
ureq = "3"

[dev-dependencies]
# Round-trip preflight (AC8): legal path dep — this crate is outside the
# workspace, so tree-sitter/cc/chrono land in THIS lockfile only.
orgsidian-parser = { path = "../../crates/orgsidian-parser" }
pretty_assertions = "1"
