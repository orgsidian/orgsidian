# nightly.yml — Story 1.8 nightly full-matrix CI gate (LD-32).
#
# LD-32 (CI matrix + merge-gate anti-atrophy, architecture.md §LD-32): the
#   nightly path runs the full matrix (macOS + Ubuntu + Arch + Windows) on a
#   schedule. The PR-side merge-gate-nightly-fresh check in pr.yml asserts
#   the most recent nightly is green within 24h — without this, full-corpus
#   gates atrophy under merge pressure (the rust-analyzer / biomejs /
#   ruff / swc pattern that survives at scale).
# LD-43 (memory soak): LANDED (Story 4.9) — the dedicated Linux-only
#   `memory-soak` job below runs the 12-hour scripted session (200 buffer
#   open/close + 50 plugin re-init + 1000 agenda queries) against the headless
#   core in one long-lived process, sampling RSS from /proc/self/statm every
#   30 min and failing if RSS grows >10% from minute 60 (warmup excluded) to
#   minute 720. A red soak fails the nightly run, which trips the pr.yml
#   `merge-gate-nightly-fresh` gate → merges to main are blocked until green.
#   The full 12h soak runs ONLY on the scheduled cron; `workflow_dispatch`
#   runs a short smoke (the `soak_minutes` input) so the orchestrator's
#   merge-gating manual nightlies validate wiring in minutes, not 12 hours.
# LD-44 (full corpus): nightly L0 round-trip full corpus + L2 Emacs oracle
#   gates LANDED (Story 2.7): the `round_trip_full` gate step runs in both
#   the hosted matrix and the arch-linux cell (macOS + Ubuntu + Arch +
#   Windows), and the `l2-emacs-oracle` job below runs the LD-45
#   ground-truth triage against pinned Emacs 29.4/30.2 images.
# LD-56 (Graph View cross-webview perf gate): nightly placeholder reserved
#   for Story 8.12.
# LD-58 (a11y hard gate): NOT scheduled nightly — wired into pr.yml by
#   Story 1.17 (it's a per-PR gate, not a nightly one).
# Reference: _bmad-output/planning-artifacts/architecture.md
#
# Slot reservations (filled by later stories): see comment markers below.

name: nightly

on:
  schedule:
    # Daily at 05:00 UTC — off-peak for GitHub-hosted runners. Chosen so the
    # most-recent-nightly check at start-of-US/EU-work-day sees today's run.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: >-
          memory-soak SMOKE duration (minutes) for manual runs. The full 12h
          LD-43 soak runs ONLY on the scheduled cron; a manual dispatch runs a
          short smoke of this many minutes so wiring is validated fast and the
          merge-gating nightly is never blocked for 12h. Keep small (default 3).
        required: false
        default: '3'

concurrency:
  group: nightly
  # Manual re-runs queue rather than cancel (preserves the audit trail).
  cancel-in-progress: false

jobs:
  # Hosted runners (macOS arm64 + Ubuntu LTS + Windows Server 2022). The
  # GitHub-hosted Windows-2022 image has WebView2 pre-installed (since 2022),
  # so the `cargo test ...export_bindings` step inside `pnpm --filter
  # shell-ui build` (which exercises tauri::Wry) works without an extra
  # install step.
  hosted:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # fail-fast: false — we need ALL platforms' status for triage. PR-side
      # uses fail-fast: true (different posture).
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Required for the tree-sitter-org grammar at
          # crates/orgsidian-parser/grammar/ (LD-48). Nightly runs
          # `cargo test --workspace` which compiles orgsidian-parser.
          submodules: recursive

      # Linux native deps for Tauri 2.x. GitHub-hosted ubuntu-24.04 does
      # NOT pre-install GTK/WebKit/libsoup development headers; glib-sys
      # build script fails otherwise. See pr.yml step 1.5 for rationale.
      - name: Install Linux native deps (Tauri 2.x)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-${{ matrix.os }}

      # pnpm/action-setup BEFORE setup-node so `cache: 'pnpm'` finds the
      # pnpm binary on PATH (footgun documented in pr.yml step 3).
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.1
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install cargo-deny + cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.18,cargo-audit@0.22

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      # Story 2.7 — L0 full-corpus round-trip gate (LD-32/LD-44). The
      # workspace test run above already executes `round_trip_full` once;
      # this dedicated step is the visible, budgeted contract (Story 2.6
      # AC2 pattern): epic-verbatim invocation (epics.md:869) plus the
      # `--locked` house rule (LD-37). Binaries are warm from the workspace
      # run, so step wall-clock is pure test runtime (~0.2s at the observed
      # 569 entries); timeout-minutes is the corpus-growth tripwire as the
      # corpus climbs back toward the ~2000-assertion target on upstream
      # pin bumps.
      - name: L0 full-corpus round-trip gate (LD-32/LD-44)
        timeout-minutes: 5
        run: cargo test -p orgsidian-parser round_trip_full --locked

      # Story 1.11: failure-mode test harness (LD-41) lands here as a
      # nightly-only gate. Per-PR runs the fast path; nightly exercises the
      # full failure-mode catalog.

      - name: cargo deny
        run: cargo deny --locked check all

      # cargo-audit `--ignore` set externalized to .cargo/audit-ignore.txt —
      # single source of truth shared with pr.yml + arch-linux cell. Lockstep
      # with docs/security/advisory-exceptions.md "Cargo advisories" table.
      # `shell: bash` forces Git-for-Windows bash on windows-2022 (default
      # is PowerShell, which doesn't understand `IGNORES=$(awk ...)`).
      - name: cargo audit
        shell: bash
        run: |
          IGNORES="$(awk '/^RUSTSEC-/ {printf "--ignore %s ", $1}' .cargo/audit-ignore.txt)"
          cargo audit --deny warnings $IGNORES

      - name: pnpm audit
        run: pnpm audit --audit-level=moderate --prod

      - name: pnpm licenses
        run: pnpm licenses ls --prod --long --json | node scripts/check-pnpm-licenses.mjs

      - name: Cross-tool allowlist sync
        run: node scripts/check-allowlist-sync.mjs

      # Skip on windows-2022: the prebuild hook regenerates
      # `shell-ui/src/lib/tauri.ts` via the `export_bindings` integration test,
      # which is cfg'd-out on Windows (see issue #120 — webview2-com-sys
      # STATUS_ENTRYPOINT_NOT_FOUND at process load). Without the regen step
      # `tsc && vite build` errors with "Cannot find module '@/lib/tauri'".
      # The shell-ui is a pure TS/JS frontend with no Windows-specific
      # behaviour at v0.1; coverage on macos-14 + ubuntu-24.04 + arch-linux
      # is sufficient. Re-enable on Windows once #120 lands (extract
      # `build_specta()` into an IPC-contract crate without `tauri::Wry`).
      - name: Build shell-ui (typecheck + bindings + i18n)
        if: matrix.os != 'windows-2022'
        run: pnpm --filter shell-ui build

      - name: i18n catalog drift check
        if: matrix.os != 'windows-2022'
        run: pnpm --filter shell-ui i18n:check

      # Slot reservations (filled by later stories):
      # Story 2.7: LANDED — the L0 full-corpus gate step sits after `cargo
      #   test` above; the L2 Emacs oracle is the top-level `l2-emacs-oracle`
      #   job below (Linux-only: docker is unavailable on macOS/Windows
      #   runners, and cross-version triage needs co-located outputs).
      # Story 8.12: Graph View cross-webview perf gate lands here
      # Story 4.9: LANDED — the LD-43 memory soak is the dedicated top-level
      #   `memory-soak` job below (Linux-only, its own 750-min budget), NOT a
      #   step in this 60-min matrix. A 12h step here would blow the matrix
      #   timeout and couple the soak to the fast full-matrix cells.

  # Arch Linux nightly cell — rolling-release canary per LD-32. No
  # GitHub-hosted Arch image exists; we run inside an `archlinux:base-devel`
  # container on an Ubuntu-LTS runner. dtolnay/rust-toolchain does not work
  # inside a non-Ubuntu container; we install rustup via pacman and run
  # `rustup default stable` explicitly so `rust-toolchain.toml` is honored
  # the same way `dtolnay/rust-toolchain@stable` honors it on hosted cells.
  arch-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch toolchain (rustup + node + pnpm + Tauri 2.x Linux deps)
        # Tauri 2.x Linux backend needs gtk3, webkit2gtk-4.1 (NOT 4.0 — Tauri
        # 2.x bumped), libsoup3, librsvg. base-devel covers the rest. We
        # install `rustup` (not `rust`) so `rust-toolchain.toml` is honored
        # identically to the hosted cells.
        run: |
          set -euo pipefail
          # NB: Arch's `nodejs` package does NOT include `npm` (separate package);
          # without it, the `npm install -g pnpm@...` line below exits 127.
          pacman -Syu --noconfirm rustup nodejs npm gtk3 webkit2gtk-4.1 libsoup3 librsvg base-devel git jq python
          rustup default stable
          rustup component add rustfmt clippy
          npm install -g pnpm@11.1.1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Required for the tree-sitter-org grammar at
          # crates/orgsidian-parser/grammar/ (LD-48). Arch cell runs the
          # full workspace cargo test, which compiles orgsidian-parser.
          submodules: recursive

      # Mark the workspace as a `safe.directory` for git. Inside the Arch
      # container the runner UID and the workspace owner UID diverge, so git
      # 2.35+ refuses to operate on the repo by default (reports "Not a git
      # repository" from any non-root cwd, e.g. `shell-ui/`). actions/checkout
      # adds safe.directory globally but the assertion doesn't survive the
      # container's HOME differences reliably — set it explicitly.
      - name: Mark workspace safe for git (Arch container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Swatinem/rust-cache@v2 — caches cargo registry + target dir for the
      # Arch cell too. Without this, every nightly cold-builds the workspace.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-arch-linux

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install cargo-deny + cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.18,cargo-audit@0.22

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      # Story 2.7 — L0 full-corpus round-trip gate (LD-32/LD-44) on the
      # Arch rolling-release canary too (the epic's OS list is macOS +
      # Ubuntu + Arch + Windows). Same named-budgeted-contract rationale as
      # the hosted cell: the workspace run above already executes
      # `round_trip_full`; this step is the visible, budgeted contract
      # (epics.md:869 + `--locked` per LD-37).
      - name: L0 full-corpus round-trip gate (LD-32/LD-44)
        timeout-minutes: 5
        run: cargo test -p orgsidian-parser round_trip_full --locked

      - name: cargo deny
        run: cargo deny --locked check all

      # cargo-audit `--ignore` set externalized to .cargo/audit-ignore.txt
      # — single source of truth (see pr.yml + nightly.yml hosted cell).
      - name: cargo audit
        run: |
          IGNORES="$(awk '/^RUSTSEC-/ {printf "--ignore %s ", $1}' .cargo/audit-ignore.txt)"
          cargo audit --deny warnings $IGNORES

      - name: pnpm audit
        run: pnpm audit --audit-level=moderate --prod

      - name: pnpm licenses
        run: pnpm licenses ls --prod --long --json | node scripts/check-pnpm-licenses.mjs

      - name: Cross-tool allowlist sync
        run: node scripts/check-allowlist-sync.mjs

      - name: Build shell-ui (typecheck + bindings + i18n)
        run: pnpm --filter shell-ui build

      - name: i18n catalog drift check
        run: pnpm --filter shell-ui i18n:check

      # Story 4.9: the LD-43 memory soak is the dedicated top-level
      # `memory-soak` job below (one Linux runner, its own 750-min budget), not
      # a step in this 60-min Arch cell.

  # Story 2.7 — L2 Emacs ground-truth oracle (LD-45). Projects every
  # designated L2 seed file (scripts/l2-oracle/seed-list.txt) through
  # `org-element` under BOTH pinned Emacs images and triages the outputs
  # against the committed canonical ASTs
  # (crates/orgsidian-parser/tests/canonical_ast/) per the LD-45 decision
  # table — comparator: scripts/l2-oracle/compare.py; runbook:
  # docs/parser/l2-oracle.md.
  #
  # Linux-only single job BY DESIGN: docker is unavailable on the GitHub
  # macOS/Windows runners, the epic's 4-OS clause binds `round_trip_full`
  # (satisfied above), and cross-version e29-vs-e30 triage needs both
  # outputs co-located. Image pinning: exact-version tags (silex/emacs is
  # the de-facto maintained multi-version image — no official `emacs`
  # repo exists on Docker Hub); tags rebuild on a rolling basis, so each
  # image digest is logged at runtime for the R-028 drift audit trail.
  l2-emacs-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # two image pulls dominate; per-file emacs batch is ~100ms
    env:
      EMACS_29_IMAGE: silex/emacs:29.4
      EMACS_30_IMAGE: silex/emacs:30.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # NO submodules: this job touches only scripts/l2-oracle/,
        # tests/fixtures/vault-corpus/, and the committed canonical ASTs —
        # no cargo, no grammar (LD-48 untouched).

      - name: Pull pinned Emacs images + log digests (R-028 audit trail)
        run: |
          set -euo pipefail
          for image in "$EMACS_29_IMAGE" "$EMACS_30_IMAGE"; do
            docker pull --quiet "$image"
            echo "R-028 digest: $(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          done

      - name: Project L2 seed under both pinned Emacs versions
        # Epic invocation shape preserved: emacs -Q --batch -l projection.el
        # --eval '(l2-project-file "...")' per designated file, per image.
        # Any docker/emacs execution failure fails the step (set -e +
        # pipefail): an oracle that cannot run is a broken gate, not a
        # skipped one.
        run: |
          set -euo pipefail
          mkdir -p /tmp/l2-out/e29 /tmp/l2-out/e30
          while IFS= read -r rel; do
            case "$rel" in '' | '#'*) continue ;; esac
            stem="$(basename "$rel" .org)"
            for leg in e29 e30; do
              if [ "$leg" = e29 ]; then image="$EMACS_29_IMAGE"; else image="$EMACS_30_IMAGE"; fi
              docker run --rm -v "$PWD:/work" -w /work "$image" \
                emacs -Q --batch -l scripts/l2-oracle/projection.el \
                --eval "(l2-project-file \"tests/fixtures/vault-corpus/$rel\")" \
                >"/tmp/l2-out/$leg/$stem.json"
            done
          done <scripts/l2-oracle/seed-list.txt

      - name: LD-45 triage (evaluate all, then fail on FAIL-class divergence)
        # OK: e29 == e30 == canonical. FAIL (::error): both Emacs agree
        # against the canonical (Orgsidian bug if the Rust leg is green;
        # canonical drift after an image bump if red). WARN (::warning,
        # non-blocking): e29 != e30 — KNOWN_DIVERGENCES.md entry per LD-45.
        run: |
          python3 scripts/l2-oracle/compare.py \
            --canonical-dir crates/orgsidian-parser/tests/canonical_ast \
            --e29-dir /tmp/l2-out/e29 --e30-dir /tmp/l2-out/e30

  # Story 4.9 — LD-43 nightly memory soak gate (NFR-21). DEDICATED Linux
  # runner job (macOS/Windows don't carry the same allocator-pressure
  # baseline). The harness (scripts/memory-soak/, a workspace-excluded Rust
  # crate) links orgsidian-core and runs the scripted session IN ONE PROCESS —
  # 200 buffer open/close + 50 plugin re-init + 1000 agenda queries — sampling
  # /proc/self/statm RSS every 30 min, then exits non-zero if RSS grows >10%
  # from minute 60 (warmup excluded) to minute 720. A non-zero exit fails this
  # job → the whole nightly run's conclusion is `failure` → pr.yml's
  # `merge-gate-nightly-fresh` refuses every merge to main until a green
  # nightly lands (the LD-32 stale-nightly gate; no change needed there).
  #
  # SCHEDULE vs DISPATCH: the full 12h soak runs ONLY on the scheduled cron.
  # A `workflow_dispatch` runs a short SMOKE (the `soak_minutes` input,
  # default 3) so the orchestrator's merge-gating manual nightlies validate
  # the wiring in minutes and are NEVER blocked for 12 hours. Both paths run
  # the SAME harness and the SAME pass/fail exit contract, so a smoke genuinely
  # exercises the gate end-to-end.
  memory-soak:
    runs-on: ubuntu-24.04
    # 12h soak + toolchain/build headroom. Comfortably above the 720-min
    # session so a slow cold build never trips the runner timeout before the
    # soak itself can report.
    timeout-minutes: 750
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The harness links orgsidian-core → orgsidian-parser, which compiles
          # the tree-sitter-org grammar submodule (LD-48).
          submodules: recursive

      # Same Tauri 2.x Linux native deps as the hosted ubuntu cell: the harness
      # links orgsidian-core, whose transitive tree pulls the GTK/WebKit/soup
      # build scripts. Without these headers glib-sys fails to build.
      - name: Install Linux native deps (Tauri 2.x)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct key: scripts/memory-soak is workspace-excluded and keeps
          # its OWN Cargo.lock + target dir (LD-5), so it must not share the
          # hosted matrix cache.
          shared-key: nightly-memory-soak
          workspaces: scripts/memory-soak

      # Build the harness first (release: the soak measures a realistic
      # allocator profile, and a warm binary keeps the 12h wall-clock as pure
      # session time). --locked per LD-37.
      - name: Build memory-soak harness
        run: cargo build --manifest-path scripts/memory-soak/Cargo.toml --release --locked

      # Choose the parameters by trigger. Schedule → the full LD-43 12h soak
      # (720 min, 30-min sampling, minute-60→720 window, 200/50/1000 workloads).
      # Dispatch → a smoke of `soak_minutes` minutes with a fast sample cadence
      # and a warmup of total/12 (mirrors minute-60-of-720) so the drift math
      # runs over a real, if compressed, window.
      - name: Run LD-43 memory soak
        run: |
          set -euo pipefail
          BIN=scripts/memory-soak/target/release/orgsidian-memory-soak
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "memory-soak: SCHEDULED run — full 12h LD-43 soak."
            "$BIN" \
              --total-seconds 43200 \
              --sample-interval-seconds 1800 \
              --warmup-seconds 3600 \
              --window-end-seconds 43200 \
              --buffer-cycles 200 \
              --plugin-reinit-cycles 50 \
              --agenda-queries 1000
          else
            MINUTES='${{ github.event.inputs.soak_minutes }}'
            MINUTES="${MINUTES:-3}"
            TOTAL_SECS=$(( MINUTES * 60 ))
            # ~30 samples across the smoke window; warmup = total/12 (the
            # minute-60-of-720 ratio). Guard the floors so tiny inputs still
            # produce a measurable baseline + end.
            # NB: plain `if` blocks, not `[ ... ] && assign` — the latter aborts
            # under `set -e` whenever the test is false (the AND-list returns
            # non-zero), which is the common case here.
            INTERVAL=$(( TOTAL_SECS / 30 ))
            if [ "$INTERVAL" -lt 1 ]; then INTERVAL=1; fi
            WARMUP_SECS=$(( TOTAL_SECS / 12 ))
            if [ "$WARMUP_SECS" -lt "$INTERVAL" ]; then WARMUP_SECS=$INTERVAL; fi
            echo "memory-soak: DISPATCH SMOKE — ${MINUTES}m (${TOTAL_SECS}s, interval ${INTERVAL}s, warmup ${WARMUP_SECS}s)."
            "$BIN" \
              --total-seconds "$TOTAL_SECS" \
              --sample-interval-seconds "$INTERVAL" \
              --warmup-seconds "$WARMUP_SECS" \
              --window-end-seconds "$TOTAL_SECS" \
              --buffer-cycles 200 \
              --plugin-reinit-cycles 50 \
              --agenda-queries 1000
          fi
