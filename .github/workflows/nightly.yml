# nightly.yml — Story 1.8 nightly full-matrix CI gate (LD-32).
#
# LD-32 (CI matrix + merge-gate anti-atrophy, architecture.md §LD-32): the
#   nightly path runs the full matrix (macOS + Ubuntu + Arch + Windows) on a
#   schedule. The PR-side merge-gate-nightly-fresh check in pr.yml asserts
#   the most recent nightly is green within 24h — without this, full-corpus
#   gates atrophy under merge pressure (the rust-analyzer / biomejs /
#   ruff / swc pattern that survives at scale).
# LD-43 (memory soak): nightly Linux-only memory soak placeholder reserved
#   for Story 4.9 (Epic 4 close-out).
# LD-44 (full corpus): nightly L0 round-trip full corpus + L2 Emacs oracle
#   placeholders reserved for Story 2.7.
# LD-56 (Graph View cross-webview perf gate): nightly placeholder reserved
#   for Story 8.12.
# LD-58 (a11y hard gate): NOT scheduled nightly — wired into pr.yml by
#   Story 1.17 (it's a per-PR gate, not a nightly one).
# Reference: _bmad-output/planning-artifacts/architecture.md
#
# Slot reservations (filled by later stories): see comment markers below.

name: nightly

on:
  schedule:
    # Daily at 05:00 UTC — off-peak for GitHub-hosted runners. Chosen so the
    # most-recent-nightly check at start-of-US/EU-work-day sees today's run.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

concurrency:
  group: nightly
  # Manual re-runs queue rather than cancel (preserves the audit trail).
  cancel-in-progress: false

jobs:
  # Hosted runners (macOS arm64 + Ubuntu LTS + Windows Server 2022). The
  # GitHub-hosted Windows-2022 image has WebView2 pre-installed (since 2022),
  # so the `cargo test ...export_bindings` step inside `pnpm --filter
  # shell-ui build` (which exercises tauri::Wry) works without an extra
  # install step.
  hosted:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # fail-fast: false — we need ALL platforms' status for triage. PR-side
      # uses fail-fast: true (different posture).
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Required for the tree-sitter-org grammar at
          # crates/orgsidian-parser/grammar/ (LD-48). Nightly runs
          # `cargo test --workspace` which compiles orgsidian-parser.
          submodules: recursive

      # Linux native deps for Tauri 2.x. GitHub-hosted ubuntu-24.04 does
      # NOT pre-install GTK/WebKit/libsoup development headers; glib-sys
      # build script fails otherwise. See pr.yml step 1.5 for rationale.
      - name: Install Linux native deps (Tauri 2.x)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-${{ matrix.os }}

      # pnpm/action-setup BEFORE setup-node so `cache: 'pnpm'` finds the
      # pnpm binary on PATH (footgun documented in pr.yml step 3).
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.1
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install cargo-deny + cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.18,cargo-audit@0.22

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      # Story 1.11: failure-mode test harness (LD-41) lands here as a
      # nightly-only gate. Per-PR runs the fast path; nightly exercises the
      # full failure-mode catalog.

      - name: cargo deny
        run: cargo deny --locked check all

      # cargo-audit `--ignore` set externalized to .cargo/audit-ignore.txt —
      # single source of truth shared with pr.yml + arch-linux cell. Lockstep
      # with docs/security/advisory-exceptions.md "Cargo advisories" table.
      # `shell: bash` forces Git-for-Windows bash on windows-2022 (default
      # is PowerShell, which doesn't understand `IGNORES=$(awk ...)`).
      - name: cargo audit
        shell: bash
        run: |
          IGNORES="$(awk '/^RUSTSEC-/ {printf "--ignore %s ", $1}' .cargo/audit-ignore.txt)"
          cargo audit --deny warnings $IGNORES

      - name: pnpm audit
        run: pnpm audit --audit-level=moderate --prod

      - name: pnpm licenses
        run: pnpm licenses ls --prod --long --json | node scripts/check-pnpm-licenses.mjs

      - name: Cross-tool allowlist sync
        run: node scripts/check-allowlist-sync.mjs

      # Skip on windows-2022: the prebuild hook regenerates
      # `shell-ui/src/lib/tauri.ts` via the `export_bindings` integration test,
      # which is cfg'd-out on Windows (see issue #120 — webview2-com-sys
      # STATUS_ENTRYPOINT_NOT_FOUND at process load). Without the regen step
      # `tsc && vite build` errors with "Cannot find module '@/lib/tauri'".
      # The shell-ui is a pure TS/JS frontend with no Windows-specific
      # behaviour at v0.1; coverage on macos-14 + ubuntu-24.04 + arch-linux
      # is sufficient. Re-enable on Windows once #120 lands (extract
      # `build_specta()` into an IPC-contract crate without `tauri::Wry`).
      - name: Build shell-ui (typecheck + bindings + i18n)
        if: matrix.os != 'windows-2022'
        run: pnpm --filter shell-ui build

      - name: i18n catalog drift check
        if: matrix.os != 'windows-2022'
        run: pnpm --filter shell-ui i18n:check

      # Slot reservations (filled by later stories):
      # Story 2.7: nightly L0 full corpus + L2 Emacs oracle gates land here
      # Story 8.12: Graph View cross-webview perf gate lands here

      # Linux-only nightly memory soak (Story 4.9 / LD-43). The 12-hour
      # memory soak runs on Linux runners only; macOS/Windows don't carry
      # the same allocator-pressure baseline. Story 4.9 owns the body.
      - name: nightly memory soak (LD-43) — placeholder
        if: matrix.os == 'ubuntu-24.04'
        run: echo "Story 4.9 wires the LD-43 12-hour memory soak here (Linux-only)."

  # Arch Linux nightly cell — rolling-release canary per LD-32. No
  # GitHub-hosted Arch image exists; we run inside an `archlinux:base-devel`
  # container on an Ubuntu-LTS runner. dtolnay/rust-toolchain does not work
  # inside a non-Ubuntu container; we install rustup via pacman and run
  # `rustup default stable` explicitly so `rust-toolchain.toml` is honored
  # the same way `dtolnay/rust-toolchain@stable` honors it on hosted cells.
  arch-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch toolchain (rustup + node + pnpm + Tauri 2.x Linux deps)
        # Tauri 2.x Linux backend needs gtk3, webkit2gtk-4.1 (NOT 4.0 — Tauri
        # 2.x bumped), libsoup3, librsvg. base-devel covers the rest. We
        # install `rustup` (not `rust`) so `rust-toolchain.toml` is honored
        # identically to the hosted cells.
        run: |
          set -euo pipefail
          # NB: Arch's `nodejs` package does NOT include `npm` (separate package);
          # without it, the `npm install -g pnpm@...` line below exits 127.
          pacman -Syu --noconfirm rustup nodejs npm gtk3 webkit2gtk-4.1 libsoup3 librsvg base-devel git jq python
          rustup default stable
          rustup component add rustfmt clippy
          npm install -g pnpm@11.1.1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Required for the tree-sitter-org grammar at
          # crates/orgsidian-parser/grammar/ (LD-48). Arch cell runs the
          # full workspace cargo test, which compiles orgsidian-parser.
          submodules: recursive

      # Mark the workspace as a `safe.directory` for git. Inside the Arch
      # container the runner UID and the workspace owner UID diverge, so git
      # 2.35+ refuses to operate on the repo by default (reports "Not a git
      # repository" from any non-root cwd, e.g. `shell-ui/`). actions/checkout
      # adds safe.directory globally but the assertion doesn't survive the
      # container's HOME differences reliably — set it explicitly.
      - name: Mark workspace safe for git (Arch container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Swatinem/rust-cache@v2 — caches cargo registry + target dir for the
      # Arch cell too. Without this, every nightly cold-builds the workspace.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-arch-linux

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install cargo-deny + cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.18,cargo-audit@0.22

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo deny
        run: cargo deny --locked check all

      # cargo-audit `--ignore` set externalized to .cargo/audit-ignore.txt
      # — single source of truth (see pr.yml + nightly.yml hosted cell).
      - name: cargo audit
        run: |
          IGNORES="$(awk '/^RUSTSEC-/ {printf "--ignore %s ", $1}' .cargo/audit-ignore.txt)"
          cargo audit --deny warnings $IGNORES

      - name: pnpm audit
        run: pnpm audit --audit-level=moderate --prod

      - name: pnpm licenses
        run: pnpm licenses ls --prod --long --json | node scripts/check-pnpm-licenses.mjs

      - name: Cross-tool allowlist sync
        run: node scripts/check-allowlist-sync.mjs

      - name: Build shell-ui (typecheck + bindings + i18n)
        run: pnpm --filter shell-ui build

      - name: i18n catalog drift check
        run: pnpm --filter shell-ui i18n:check

      # Same Story-4.9 memory soak slot also applies to Arch (Linux family).
      - name: nightly memory soak (LD-43) — placeholder
        run: echo "Story 4.9 wires the LD-43 12-hour memory soak here (Linux-only, applies to Arch too)."
