# pr.yml — Story 1.8 per-PR CI gate (LD-32 / LD-37 / LD-38).
#
# LD-32 (CI matrix, architecture.md §LD-32): per-PR runs on macOS-arm64 +
#   Ubuntu-LTS only — fast subset gate. Target <90s p50 wall-clock on warm
#   cache (soft target; no enforcement yet). The full matrix runs nightly.
# LD-37 (Cargo.lock as source of truth + supply-chain): every cargo invocation
#   passes `--locked`; cargo-deny + cargo-audit + pnpm audit + pnpm licenses
#   all run on every PR.
# LD-38 (Plugin panic isolation): the `[profile.release] panic = "unwind"`
#   override + the `invoke_plugin_hook!` macro stub introduced in Story 1.8
#   ride alongside this workflow; CI greenness is what proves both compile.
# Version policy: action versions semver-major-pinned (`@v5`, `@v2`) per
#   [[feedback_version_policy]]; runner images PINNED (`macos-14`,
#   `ubuntu-24.04`) — never `*-latest` (LD-32 binds the matrix).
# Reference: _bmad-output/planning-artifacts/architecture.md
#
# Slot reservations (filled by later stories): see comment markers below.

name: pr

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      # Step 1 — checkout. submodules: recursive — required for the
      # tree-sitter-org grammar at crates/orgsidian-parser/grammar/ (LD-48).
      # If the submodule is ever moved to a private repo (LD-48 in-house fork
      # trigger fires), add `token: ${{ secrets.SUBMODULE_PAT }}` here.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Step 1.5 — Linux native deps for Tauri 2.x (GTK3 + WebKit2GTK 4.1 +
      # libsoup3 + librsvg + ayatana-appindicator3). The GitHub-hosted
      # `ubuntu-24.04` image does NOT pre-install these; `glib-sys` /
      # `webkit2gtk-sys` build scripts fail at `pkg-config glib-2.0` /
      # `webkit2gtk-4.1` otherwise. macOS-arm64 gets the equivalents from
      # Xcode's system frameworks (no install step needed).
      - name: Install Linux native deps (Tauri 2.x)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential \
            libssl-dev \
            pkg-config

      # Step 2 — Rust toolchain + cache. `rust-toolchain.toml` pins channel +
      # rustfmt + clippy components, so dtolnay/rust-toolchain@stable respects
      # the workspace pin. Swatinem/rust-cache@v2 caches both the cargo
      # registry and the target dir, keyed per-OS.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-${{ matrix.os }}
          # Story 2.6 (AC3): register the root workspace AND both tool crates
          # (each OUTSIDE [workspace.members] per LD-5, each with its own
          # target dir + lockfile). Without this the extractor's parser
          # path-dep (tree-sitter + cc + chrono) recompiles cold on every PR
          # (~2-4 min/cell) — and the issues-sync build was never cached
          # either (pre-existing gap, fixed in the same stroke). Cache keys
          # now hash the tool lockfiles too, so tool-dep bumps bust correctly.
          workspaces: |
            .
            tools/corpus-extractor
            tools/issues-sync

      # Step 3 — pnpm + Node. ORDER MATTERS: pnpm/action-setup MUST run
      # BEFORE actions/setup-node so `cache: 'pnpm'` finds the pnpm binary on
      # PATH (well-known footgun).
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.1
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      # Step 4 — JS deps. --frozen-lockfile makes CI fail if pnpm-lock.yaml
      # drifts from package.json.
      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # Step 5 — cargo-deny + cargo-audit (pre-built binaries via
      # taiki-e/install-action — saves ~3 min/cell vs. `cargo install`).
      # Pinned to current 2026-05 minors per [[feedback_version_policy]].
      # cargo-audit MUST be >=0.22 — earlier minors lack CVSS v4.0 parser
      # support and fail loading the advisory DB (RUSTSEC-2026-0073+ use 4.0).
      - name: Install cargo-deny + cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.18,cargo-audit@0.22

      # Step 6 — Rust format.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Step 7 — Rust clippy (LD-37: --locked on every cargo invocation).
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Step 8 — Rust build.
      - name: cargo build
        run: cargo build --workspace --locked

      # Step 9 — Rust test.
      - name: cargo test
        run: cargo test --workspace --locked

      # Step 9.1 — tools/issues-sync test suite. Story 1.16 LD-55 binary +
      # wiremock-backed integration smoke. Crate is OUTSIDE [workspace.members]
      # (LD-5), so --workspace doesn't pick it up. Runs ~5s; folded into the
      # matrix per Story 1.16 §10 Q6 default (vs. dedicated workflow).
      - name: cargo test (tools/issues-sync)
        run: cargo test --manifest-path tools/issues-sync/Cargo.toml --locked

      # Step 9.2 — L0 round-trip subset gate (Story 2.6: LD-32/LD-44, FR-2
      # enforcement). Invocation is epic-verbatim (epics.md:854) plus
      # `--locked` per the LD-37 house rule. Step 9's `cargo test --workspace`
      # already executes round_trip_subset once — this dedicated step is the
      # named, budgeted contract (visible step timing in the Actions UI +
      # the <60s budget enforced via timeout-minutes: 1), not redundant
      # coverage by accident. The budget is safe: the step reuses test
      # binaries already compiled by Step 9 in this job, so its wall-clock is
      # pure test runtime (measured 1.66s for the 100-entry embedded subset
      # + 18 interim files, debug profile).
      - name: L0 round-trip subset gate (LD-32/LD-44, <60s)
        timeout-minutes: 1
        run: cargo test -p orgsidian-parser round_trip_subset --locked -- --test-threads=4

      # Step 9.3 — tools/corpus-extractor test suite (Story 2.6 AC3 — closes
      # the story-2.5 deferred item; mirrors the Step 9.1 issues-sync
      # precedent). Crate is OUTSIDE [workspace.members] (LD-5
      # leaf-isolation), so --workspace doesn't pick it up. Runs the 65-test
      # suite: notably the TC-3 matrix meta-test (committed subset-pr.json
      # still satisfies the LD-44 matrix — fixture-rot tripwire now fires
      # per-PR) and the round-trip preflight twin (all 100 entries through
      # the parser path-dep — an independent second execution of the L0
      # property). Network-free by design: fetch is a maintainer operation —
      # never add fetch/extract invocations here.
      - name: cargo test (tools/corpus-extractor)
        run: cargo test --manifest-path tools/corpus-extractor/Cargo.toml --locked

      # Step 10 — cargo-deny (uses deny.toml from Story 1.7).
      - name: cargo deny
        run: cargo deny --locked check all

      # Step 11 — cargo-audit. The advisory `--ignore` set is externalized to
      # `.cargo/audit-ignore.txt` (single source of truth across pr.yml +
      # nightly.yml hosted/arch cells). cargo-audit 0.21/0.22 has no
      # `--config` flag, so we expand the list inline. Kept in lockstep with
      # the "Cargo advisories" table in docs/security/advisory-exceptions.md
      # per LD-37.
      # Story 2.6 (AC4, ADR 0001 §6): the second invocation audits the
      # extractor's standalone lockfile via `--file` (the crate is
      # workspace-excluded, so the root scan never sees it). Same $IGNORES
      # expansion on purpose — lockstep beats divergence. License-side scan
      # stays audit-only (scoped cargo-deny needs allowlist changes —
      # re-deferred, see deferred-work.md story-2.6 stanza).
      - name: cargo audit
        run: |
          IGNORES="$(awk '/^RUSTSEC-/ {printf "--ignore %s ", $1}' .cargo/audit-ignore.txt)"
          cargo audit --deny warnings $IGNORES
          cargo audit --deny warnings $IGNORES --file tools/corpus-extractor/Cargo.lock

      # Step 12 — JS supply-chain audit.
      - name: pnpm audit
        run: pnpm audit --audit-level=moderate --prod

      # Step 13 — JS license audit (Story 1.7 script).
      - name: pnpm licenses
        run: pnpm licenses ls --prod --long --json | node scripts/check-pnpm-licenses.mjs

      # Step 13.5 — cross-tool allowlist sync check (Story 1.7 deferred-work,
      # closed in Story 1.8 AC6). Fails if deny.toml + check-pnpm-licenses.mjs
      # diverge without a documented exception in
      # docs/security/advisory-exceptions.md "License exceptions" table.
      - name: Cross-tool allowlist sync
        run: node scripts/check-allowlist-sync.mjs

      # Step 14 — TypeScript build + typecheck. The `prebuild` script (in
      # shell-ui/package.json) chains: tsr generate (TanStack routes) +
      # lingui compile (i18n catalogs) + cargo test ...export_bindings...
      # (tauri-specta bindings regen → tsc + vite build runs after. Single
      # invocation exercises i18n + IPC bindings round-trip + TS strict
      # typecheck end-to-end. DO NOT split — would re-compile.
      - name: Build shell-ui (typecheck + bindings + i18n)
        run: pnpm --filter shell-ui build

      # Step 15 — i18n catalog drift gate (Story 1.6 declared CI-ready and
      # deferred wiring to Story 1.8). `lingui extract --clean && git diff
      # --exit-code src/locales` fails if catalog files drift from source.
      - name: i18n catalog drift check
        run: pnpm --filter shell-ui i18n:check

      # Story 4.1 (review): run the shell-ui Vitest suite so component unit
      # tests gate merges — notably the CM6 host StrictMode leak-safety suite,
      # which `pnpm build` only typechecks and the a11y gate's scoped
      # `test:contrast` never collects. `vitest run` picks up all
      # src/**/*.test.{ts,tsx} per vitest.config.ts.
      - name: shell-ui unit tests (Vitest)
        run: pnpm --filter shell-ui test

      # Slot reservations (filled by later stories — do NOT pre-implement
      # the bodies here; the supporting deps + scaffolding don't exist yet):
      # Story 1.17: pnpm a11y hard gate (contrast + axe-core + keyboard scenarios) lands here
      # Story 1.12 perf snapshot regression macro: now wired via assert_no_perf_regression! in crates/orgsidian-core/src/test_support/perf.rs and consumed by perf-AC stories.
      # Story 2.6 L0 round-trip subset gate: landed 2026-06-11 as Step 9.2 above (epic-verbatim invocation + --locked, timeout-minutes: 1).

      # Step 16 (Story 1.17, LD-58) — WCAG 2.1 AA hard gate:
      #   (a) contrast-matrix Vitest test on shell-ui/src/themes/tokens.css
      #   (b) 6 @a11y-tagged Playwright scenarios with @axe-core/playwright
      #       (currently scaffolds via test.fixme; downstream stories awaken them)
      # Budget: ≤2-3 min combined per LD-58 line 1371; well within the LD-32
      # <90s/<10min per-PR soft target on warm Playwright browser cache.
      # Inventory guard: LD-58 prescribes exactly 6 @a11y surfaces. Catches
      # accidental spec-file deletion before the gate atrophies silently.
      - name: Verify 6 @a11y spec files (LD-58 inventory)
        run: |
          count=$(grep -lr "@a11y" shell-ui/e2e/a11y/ | wc -l | tr -d ' ')
          if [ "$count" != "6" ]; then
            echo "::error::Expected 6 @a11y spec files in shell-ui/e2e/a11y/, found $count (LD-58 inventory drift)"
            exit 1
          fi

      # Cache key hashes both package.json AND pnpm-lock.yaml so a lockfile-only
      # Playwright bump (e.g., transitive resolution change) busts the cache.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('shell-ui/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: pnpm --filter shell-ui exec playwright install --with-deps chromium

      - name: a11y hard gate (LD-58 — contrast + axe-core + keyboard scenarios)
        run: pnpm a11y

  # Standalone merge-gate job. MUST be a top-level job (not a matrix step) so
  # GitHub publishes a `merge-gate-nightly-fresh` status context that branch
  # protection can require. Step-level checks are not reported as contexts.
  #
  # LD-32 anti-atrophy: GitHub does not natively understand "most-recent
  # nightly on main was green within 24h". This job queries the Actions API
  # and enforces the rule. Bootstrap-safe: if `.github/workflows/nightly.yml`
  # does not yet exist on the base ref (i.e., this PR is the one introducing
  # the workflow), the gate soft-passes with a warning.
  merge-gate-nightly-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout base ref (for nightly.yml presence check)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # submodules: false intentional — this job only reads
          # .github/workflows/nightly.yml from base ref. No submodule-touching
          # code runs here, so skipping the fetch saves ~3s/PR.
          submodules: false
      - name: merge-gate-nightly-fresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Bootstrap path: if nightly.yml does not exist on the base ref,
          # this PR is the one introducing it. Soft-pass — the gate becomes
          # active starting from the next PR (once nightly.yml is on main).
          if [ ! -f .github/workflows/nightly.yml ]; then
            echo "merge-gate-nightly-fresh: SOFT-PASS — nightly.yml not yet on base ref. Gate activates after this PR merges."
            exit 0
          fi
          # Query the most recent nightly.yml run on the default branch.
          payload="$(gh api \
            'repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?per_page=1&branch=main' \
            --jq '.workflow_runs[0] // {}')"
          if [ -z "$payload" ] || [ "$payload" = "{}" ]; then
            echo "::error::No nightly.yml runs found on main yet. Trigger one via workflow_dispatch before merging."
            exit 1
          fi
          conclusion="$(echo "$payload" | jq -r '.conclusion')"
          updated_at="$(echo "$payload" | jq -r '.updated_at')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Most recent nightly.yml run on main has conclusion='$conclusion' (expected 'success'). Re-run nightly green before merging."
            exit 1
          fi
          # Freshness window: 24h = 86400s. `date -d` (GNU) is unavailable on
          # macOS; we use the ISO-8601 epoch conversion which is portable.
          run_epoch="$(python3 -c "import datetime,sys; print(int(datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00')).timestamp()))" "$updated_at")"
          now_epoch="$(date -u +%s)"
          age=$(( now_epoch - run_epoch ))
          if [ "$age" -gt 86400 ]; then
            echo "::error::Most recent nightly.yml run on main is $age seconds old (>86400s). Trigger nightly via workflow_dispatch before merging."
            exit 1
          fi
          echo "merge-gate-nightly-fresh: OK — last nightly green at $updated_at ($age seconds ago)."
