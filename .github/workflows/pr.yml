# pr.yml — Story 1.8 per-PR CI gate (LD-32 / LD-37 / LD-38).
#
# LD-32 (CI matrix, architecture.md §LD-32): per-PR runs on macOS-arm64 +
#   Ubuntu-LTS only — fast subset gate. Target <90s p50 wall-clock on warm
#   cache (soft target; no enforcement yet). The full matrix runs nightly.
# LD-37 (Cargo.lock as source of truth + supply-chain): every cargo invocation
#   passes `--locked`; cargo-deny + cargo-audit + pnpm audit + pnpm licenses
#   all run on every PR.
# LD-38 (Plugin panic isolation): the `[profile.release] panic = "unwind"`
#   override + the `invoke_plugin_hook!` macro stub introduced in Story 1.8
#   ride alongside this workflow; CI greenness is what proves both compile.
# Version policy: action versions semver-major-pinned (`@v5`, `@v2`) per
#   [[feedback_version_policy]]; runner images PINNED (`macos-14`,
#   `ubuntu-24.04`) — never `*-latest` (LD-32 binds the matrix).
# Reference: _bmad-output/planning-artifacts/architecture.md
#
# Slot reservations (filled by later stories): see comment markers below.

name: pr

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      # Step 1 — checkout. submodules: false today; Story 2.1 flips to
      # `recursive` when tree-sitter-org lands as a SHA-pinned submodule.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      # Step 2 — Rust toolchain + cache. `rust-toolchain.toml` pins channel +
      # rustfmt + clippy components, so dtolnay/rust-toolchain@stable respects
      # the workspace pin. Swatinem/rust-cache@v2 caches both the cargo
      # registry and the target dir, keyed per-OS.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-${{ matrix.os }}

      # Step 3 — pnpm + Node. ORDER MATTERS: pnpm/action-setup MUST run
      # BEFORE actions/setup-node so `cache: 'pnpm'` finds the pnpm binary on
      # PATH (well-known footgun).
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.1
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      # Step 4 — JS deps. --frozen-lockfile makes CI fail if pnpm-lock.yaml
      # drifts from package.json.
      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # Step 5 — cargo-deny + cargo-audit (pre-built binaries via
      # taiki-e/install-action — saves ~3 min/cell vs. `cargo install`).
      # Pinned to current 2026-05 minors per [[feedback_version_policy]].
      - name: Install cargo-deny + cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.18,cargo-audit@0.21

      # Step 6 — Rust format.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Step 7 — Rust clippy (LD-37: --locked on every cargo invocation).
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Step 8 — Rust build.
      - name: cargo build
        run: cargo build --workspace --locked

      # Step 9 — Rust test.
      - name: cargo test
        run: cargo test --workspace --locked

      # Step 10 — cargo-deny (uses deny.toml from Story 1.7).
      - name: cargo deny
        run: cargo deny --locked check all

      # Step 11 — cargo-audit. `--ignore RUSTSEC-2024-0429` tracks the
      # transitive glib 0.18.5 unsoundness flagged in Story 1.7 deferred-work
      # (Linux-only; macOS doesn't see it). Lockstep with
      # docs/security/advisory-exceptions.md is enforced by Story 1.7's
      # ledger discipline + the cross-tool allowlist check at step 13.5.
      # cargo-audit `--ignore` list is kept in lockstep with
      # docs/security/advisory-exceptions.md "Cargo advisories" table per
      # LD-37. The set covers the Tauri 2.x gtk-rs Linux transitive stack
      # + paste/proc-macro-error/unic-* transitives (all informational
      # warnings; cargo-deny's `unmaintained = "workspace"` already handles
      # the workspace-owned case).
      - name: cargo audit
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2024-0429 \
            --ignore RUSTSEC-2024-0411 \
            --ignore RUSTSEC-2024-0412 \
            --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0414 \
            --ignore RUSTSEC-2024-0415 \
            --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0417 \
            --ignore RUSTSEC-2024-0418 \
            --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0420 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2025-0075 \
            --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0081 \
            --ignore RUSTSEC-2025-0098 \
            --ignore RUSTSEC-2025-0100

      # Step 12 — JS supply-chain audit.
      - name: pnpm audit
        run: pnpm audit --audit-level=moderate --prod

      # Step 13 — JS license audit (Story 1.7 script).
      - name: pnpm licenses
        run: pnpm licenses ls --prod --long --json | node scripts/check-pnpm-licenses.mjs

      # Step 13.5 — cross-tool allowlist sync check (Story 1.7 deferred-work,
      # closed in Story 1.8 AC6). Fails if deny.toml + check-pnpm-licenses.mjs
      # diverge without a documented exception in
      # docs/security/advisory-exceptions.md "License exceptions" table.
      - name: Cross-tool allowlist sync
        run: node scripts/check-allowlist-sync.mjs

      # Step 14 — TypeScript build + typecheck. The `prebuild` script (in
      # shell-ui/package.json) chains: tsr generate (TanStack routes) +
      # lingui compile (i18n catalogs) + cargo test ...export_bindings...
      # (tauri-specta bindings regen → tsc + vite build runs after. Single
      # invocation exercises i18n + IPC bindings round-trip + TS strict
      # typecheck end-to-end. DO NOT split — would re-compile.
      - name: Build shell-ui (typecheck + bindings + i18n)
        run: pnpm --filter shell-ui build

      # Step 15 — i18n catalog drift gate (Story 1.6 declared CI-ready and
      # deferred wiring to Story 1.8). `lingui extract --clean && git diff
      # --exit-code src/locales` fails if catalog files drift from source.
      - name: i18n catalog drift check
        run: pnpm --filter shell-ui i18n:check

      # Slot reservations (filled by later stories — do NOT pre-implement
      # the bodies here; the supporting deps + scaffolding don't exist yet):
      # Story 1.17: pnpm a11y hard gate (contrast + axe-core + keyboard scenarios) lands here
      # Story 1.12: perf snapshot regression macro lands here
      # Story 2.6: L0 round-trip subset gate (~100 files, <60s) lands here

      # Step 16 — merge gate: most-recent-nightly green within 24h
      # (LD-32 anti-atrophy: GitHub doesn't natively understand this rule;
      # we enforce by querying the Actions API and asserting conclusion +
      # freshness). The PR cannot merge until this check is green. Skipped
      # on push-to-main (only enforced on PRs) so the merge commit's CI
      # run isn't gated by its own nightly that hasn't run yet.
      - name: merge-gate-nightly-fresh
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Query the most recent nightly.yml run on the default branch.
          payload="$(gh api \
            'repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?per_page=1&branch=main' \
            --jq '.workflow_runs[0] // {}')"
          if [ -z "$payload" ] || [ "$payload" = "{}" ]; then
            echo "::error::No nightly.yml runs found on main yet. Trigger one via workflow_dispatch before merging."
            exit 1
          fi
          conclusion="$(echo "$payload" | jq -r '.conclusion')"
          updated_at="$(echo "$payload" | jq -r '.updated_at')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Most recent nightly.yml run on main has conclusion='$conclusion' (expected 'success'). Re-run nightly green before merging."
            exit 1
          fi
          # Freshness window: 24h = 86400s. `date -d` (GNU) is unavailable on
          # macOS; we use the ISO-8601 epoch conversion which is portable.
          run_epoch="$(python3 -c "import datetime,sys; print(int(datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00')).timestamp()))" "$updated_at")"
          now_epoch="$(date -u +%s)"
          age=$(( now_epoch - run_epoch ))
          if [ "$age" -gt 86400 ]; then
            echo "::error::Most recent nightly.yml run on main is $age seconds old (>86400s). Trigger nightly via workflow_dispatch before merging."
            exit 1
          fi
          echo "merge-gate-nightly-fresh: OK — last nightly green at $updated_at ($age seconds ago)."
