# pnpm workspace declaration — Story 1.2 establishes the JS sub-workspace
# with `shell-ui` as the only member (per LD-5 round-4 amendment:
# no `packages/` indirection until a 2nd JS package exists).
# `allowBuilds` retains the pnpm 11.x build-script approval shim from
# Story 1.1 — required to silence the "Ignored build scripts" warning
# on every install (`pnpm.onlyBuiltDependencies` in package.json is not
# honored by pnpm 11.1.1).
packages:
  - shell-ui
allowBuilds:
  esbuild: true
