# pnpm workspace declaration — Story 1.2 establishes the JS sub-workspace
# with `shell-ui` as the only member (per LD-5 round-4 amendment:
# no `packages/` indirection until a 2nd JS package exists).
# `allowBuilds` retains the pnpm 11.x build-script approval shim from
# Story 1.1 — required to silence the "Ignored build scripts" warning
# on every install (`pnpm.onlyBuiltDependencies` in package.json is not
# honored by pnpm 11.1.1).
packages:
  - shell-ui
allowBuilds:
  '@swc/core': true
  esbuild: true
# Transitive-dependency security overrides. pnpm 11.x reads `overrides` from
# here, not from package.json's `pnpm.overrides` (same relocation as the
# settings note above). nanoid <3.3.17 is GHSA-2v37-7h3g-55p8 (high: custom
# generators loop indefinitely when size is zero); it arrives only via
# @tailwindcss/vite > vite > postcss, which needs the nanoid 3.x line (4.x+
# are ESM-only). The scoped selector patches just the vulnerable range and
# leaves any future major untouched.
overrides:
  nanoid@<3.3.17: ^3.3.17
  # browserslist <=4.28.6 is GHSA-c83g-rgw3-j3cx (unbounded memory growth) +
  # GHSA-73wf-gq98-2v4g (crash / prototype write); patched in 4.28.7. Arrives
  # transitively via @lingui/* > @babel/core > @babel/helper-compilation-
  # targets > browserslist. Scoped selector patches only the vulnerable range.
  browserslist@<4.28.7: ^4.28.7
