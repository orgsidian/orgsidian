# Fixture ownership declaration (Story 2.5, Murat P1 — test-design.md §5.2
# schema with corrected real paths). HAND-MAINTAINED, not generated.
#
# Governance (CONTRIBUTING §5):
# - Every fixture set is owned by exactly ONE epic.
# - Mutating a fixture set requires PR review naming the owning epic, with the
#   commit-message tag `[fixture:epic-N]` (advisory convention — GitHub Free
#   cannot enforce branch protection; maintainer checks pre-merge).
# - Generated fixtures are NEVER hand-edited: regeneration PRs must quote the
#   generator invocation and the upstream pin.
# - Future fixture sets (synthetic vaults LD-42, golden traces, canonical
#   ASTs, UJ vaults) are added here by their owning stories — do not
#   pre-declare paths that do not exist yet.

[corpus.subset-pr]
path = "fixtures/subset-pr.json"
owner = "epic-2"
regenerated_by = "tools/corpus-extractor"
ld_reference = "LD-44"
notes = "L0 per-PR round-trip subset (100 files, embedded content — LFS-free PR gate). Consumed by Story 2.6's round_trip_subset gate and the extractor's verify/meta-test."

[corpus.full-nightly]
path = "fixtures/full-nightly.json"
owner = "epic-2"
regenerated_by = "tools/corpus-extractor"
ld_reference = "LD-44"
notes = "Pointer manifest over the full nightly corpus (one entry per harvested test-org-element.el assertion). Consumed by Story 2.7's nightly gate."

[corpus.vault-corpus]
path = "tests/fixtures/vault-corpus/"
owner = "epic-2"
regenerated_by = "tools/corpus-extractor"
ld_reference = "LD-44"
notes = "Materialized .org corpus (full corpus + subset twins). Designed for git-LFS (*.org only); currently committed raw per the Story 2.5 AC6 fallback — FOLLOWUP(LFS-migration) marker in .gitattributes (re-deferred by Story 2.6; no history rewrite while stacked PRs are open). Derived from the GNU org-mode test suite — see its README.md for provenance/licensing."

